name: Feature request
description: Propose a focused improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: input
    id: repository
    attributes:
      label: Repository
      description: Which organization repository should own this feature?
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What research or software need would this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the desired behaviour, inputs and outputs.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation
      description: How could the change be tested, especially for schema or physics effects?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

